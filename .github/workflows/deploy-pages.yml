name: Deploy demo web (GitHub Pages)

# INSTALLATION : ce fichier doit finir en .github/workflows/deploy-pages.yml
# à la racine du repo GitHub (voir GITHUB.md). Publie l'interface embarquée
# (app/src/main/assets/www) comme démo web, à chaque push sur main.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Contrôle du site
        run: |
          test -f app/src/main/assets/www/index.html || (echo "MANQUE www/index.html" && exit 1)
          test -f app/src/main/assets/www/js/config.js || (echo "MANQUE js/config.js" && exit 1)
          echo "Site OK"

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets/www

      - id: deployment
        uses: actions/deploy-pages@v4
